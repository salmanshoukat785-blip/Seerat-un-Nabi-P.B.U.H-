{
  "name": "Release APK",
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "release": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Find project (unzip if needed)",
          "id": "project",
          "shell": "bash",
          "run": "if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then\n  dir=\".\"\nelse\n  zip=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | sort | tail -n 1)\n  if [ -z \"$zip\" ]; then\n    echo \"No Android project and no .zip file found in the repo.\"\n    exit 1\n  fi\n  echo \"Unzipping: $zip\"\n  mkdir -p _unzipped\n  unzip -q -o \"$zip\" -d _unzipped\n  settings=$(find _unzipped \\( -name 'settings.gradle.kts' -o -name 'settings.gradle' \\) | head -n 1)\n  if [ -z \"$settings\" ]; then\n    echo \"settings.gradle(.kts) not found inside the zip.\"\n    exit 1\n  fi\n  dir=$(dirname \"$settings\")\nfi\necho \"Project folder: $dir\"\necho \"dir=$dir\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Set up JDK 17",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": 17
          }
        },
        {
          "name": "Install Gradle 8.9 (with fallback mirrors)",
          "shell": "bash",
          "run": "set -e\nV=8.9\nmkdir -p \"$HOME/gradle-dist\"\ncd \"$HOME/gradle-dist\"\nok=\"\"\nfor url in \\\n  \"https://github.com/gradle/gradle-distributions/releases/download/v${V}.0/gradle-${V}-bin.zip\" \\\n  \"https://services.gradle.org/distributions/gradle-${V}-bin.zip\" \\\n  \"https://downloads.gradle.org/distributions/gradle-${V}-bin.zip\" \\\n  \"https://mirrors.mit.edu/macports/distfiles/gradle/gradle-${V}-bin.zip\" \\\n  \"https://mirrors.cloud.tencent.com/gradle/gradle-${V}-bin.zip\"; do\n  echo \"Trying $url\"\n  rm -f gradle.zip\n  if curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 20 -o gradle.zip \"$url\" && unzip -tq gradle.zip >/dev/null 2>&1; then\n    ok=1\n    break\n  fi\n  echo \"Failed, trying next source\"\ndone\nif [ -z \"$ok\" ]; then\n  echo \"Could not download Gradle $V from any source.\"\n  exit 1\nfi\nunzip -q gradle.zip\necho \"$HOME/gradle-dist/gradle-${V}/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Gradle version",
          "run": "gradle --version"
        },
        {
          "name": "Prepare signing key",
          "shell": "bash",
          "env": {
            "KS_B64": "${{ secrets.KEYSTORE_BASE64 }}",
            "KS_PASS": "${{ secrets.KEYSTORE_PASSWORD }}",
            "KS_ALIAS": "${{ secrets.KEY_ALIAS }}",
            "KS_KEY_PASS": "${{ secrets.KEY_PASSWORD }}"
          },
          "run": "set -e\nif [ -n \"$KS_B64\" ]; then\n  echo \"$KS_B64\" | base64 -d > \"$HOME/release.jks\"\n  echo \"KEYSTORE_PASSWORD=$KS_PASS\" >> \"$GITHUB_ENV\"\n  echo \"KEY_ALIAS=$KS_ALIAS\" >> \"$GITHUB_ENV\"\n  echo \"KEY_PASSWORD=$KS_KEY_PASS\" >> \"$GITHUB_ENV\"\n  echo \"Using your keystore from repository secrets.\"\nelse\n  echo \"::warning::No keystore secrets found. Signing with a temporary key. Updates will not install over an older version; uninstall the old one first.\"\n  keytool -genkeypair -keystore \"$HOME/release.jks\" -storepass seerat123 -keypass seerat123 -alias seerat -keyalg RSA -keysize 2048 -validity 10000 -dname \"CN=Seerat un-Nabi\"\n  echo \"KEYSTORE_PASSWORD=seerat123\" >> \"$GITHUB_ENV\"\n  echo \"KEY_ALIAS=seerat\" >> \"$GITHUB_ENV\"\n  echo \"KEY_PASSWORD=seerat123\" >> \"$GITHUB_ENV\"\nfi\necho \"KEYSTORE_PATH=$HOME/release.jks\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Set app version",
          "shell": "bash",
          "run": "v=\"${GITHUB_REF_NAME}\"\nv=\"${v#v}\"\ncase \"$v\" in [0-9]*) echo \"APP_VERSION=$v\" >> \"$GITHUB_ENV\";; esac\n"
        },
        {
          "name": "Build signed release APK",
          "working-directory": "${{ steps.project.outputs.dir }}",
          "shell": "bash",
          "run": "set +e\nOPTS=\"--console=plain --no-daemon -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000 -Dorg.gradle.internal.http.connectionTimeout=90000 -Dorg.gradle.internal.http.socketTimeout=90000\"\nfor i in 1 2 3 4; do\n  echo \"=== Build attempt $i ===\"\n  gradle assembleRelease $OPTS 2>&1 | tee build.log\n  code=${PIPESTATUS[0]}\n  if [ \"$code\" -eq 0 ]; then\n    exit 0\n  fi\n  if grep -qE \"Could not (resolve|download|GET|HEAD)|Received status code 5|HTTP 5|Read timed out|Connection (reset|timed out)|Premature end|Unexpected end of\" build.log; then\n    echo \"Network problem while downloading dependencies. Waiting, then retrying.\"\n    sleep 30\n  else\n    echo \"Build error (not a network problem). See 'What went wrong' above.\"\n    exit \"$code\"\n  fi\ndone\nexit 1\n"
        },
        {
          "name": "Upload release APK",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "seerat-release-apk",
            "path": "${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Attach APK to GitHub release (tags only)",
          "if": "startsWith(github.ref, 'refs/tags/')",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "files": "${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk"
          }
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": null,
    "push": {
      "tags": [
        "v*"
      ]
    }
  }
}
