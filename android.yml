{
  "name": "Build APK",
  "concurrency": {
    "group": "build-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Find project (unzip if needed)",
          "id": "project",
          "shell": "bash",
          "run": "if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then\n  dir=\".\"\nelse\n  zip=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | sort | tail -n 1)\n  if [ -z \"$zip\" ]; then\n    echo \"No Android project and no .zip file found in the repo.\"\n    exit 1\n  fi\n  echo \"Unzipping: $zip\"\n  mkdir -p _unzipped\n  unzip -q -o \"$zip\" -d _unzipped\n  settings=$(find _unzipped \\( -name 'settings.gradle.kts' -o -name 'settings.gradle' \\) | head -n 1)\n  if [ -z \"$settings\" ]; then\n    echo \"settings.gradle(.kts) not found inside the zip.\"\n    exit 1\n  fi\n  dir=$(dirname \"$settings\")\nfi\necho \"Project folder: $dir\"\necho \"dir=$dir\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Set up JDK 17",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": 17
          }
        },
        {
          "name": "Set up Gradle",
          "uses": "gradle/actions/setup-gradle@v4",
          "with": {
            "gradle-version": 8.9
          }
        },
        {
          "name": "Build debug APK",
          "working-directory": "${{ steps.project.outputs.dir }}",
          "run": "gradle assembleDebug --stacktrace"
        },
        {
          "name": "Upload APK",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "seerat-debug-apk",
            "path": "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Lint (optional)",
          "continue-on-error": true,
          "working-directory": "${{ steps.project.outputs.dir }}",
          "run": "gradle lintDebug --stacktrace"
        },
        {
          "name": "Upload lint report",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "lint-report",
            "path": "${{ steps.project.outputs.dir }}/app/build/reports/lint-results-debug.html",
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  },
  "on": {
    "push": {
      "branches": [
        "main",
        "master"
      ]
    },
    "pull_request": null,
    "workflow_dispatch": null
  }
}
