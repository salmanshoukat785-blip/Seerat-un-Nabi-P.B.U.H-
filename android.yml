{
  "name": "Build APK",
  "concurrency": {
    "group": "build-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Find project (unzip if needed)",
          "id": "project",
          "shell": "bash",
          "run": "if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then\n  dir=\".\"\nelse\n  zip=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | sort | tail -n 1)\n  if [ -z \"$zip\" ]; then\n    echo \"No Android project and no .zip file found in the repo.\"\n    exit 1\n  fi\n  echo \"Unzipping: $zip\"\n  mkdir -p _unzipped\n  unzip -q -o \"$zip\" -d _unzipped\n  settings=$(find _unzipped \\( -name 'settings.gradle.kts' -o -name 'settings.gradle' \\) | head -n 1)\n  if [ -z \"$settings\" ]; then\n    echo \"settings.gradle(.kts) not found inside the zip.\"\n    exit 1\n  fi\n  dir=$(dirname \"$settings\")\nfi\necho \"Project folder: $dir\"\necho \"dir=$dir\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Set up JDK 17",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": 17
          }
        },
        {
          "name": "Install Gradle 8.9 (with fallback mirrors)",
          "shell": "bash",
          "run": "set -e\nV=8.9\nmkdir -p \"$HOME/gradle-dist\"\ncd \"$HOME/gradle-dist\"\nok=\"\"\nfor url in \\\n  \"https://github.com/gradle/gradle-distributions/releases/download/v${V}.0/gradle-${V}-bin.zip\" \\\n  \"https://services.gradle.org/distributions/gradle-${V}-bin.zip\" \\\n  \"https://downloads.gradle.org/distributions/gradle-${V}-bin.zip\" \\\n  \"https://mirrors.mit.edu/macports/distfiles/gradle/gradle-${V}-bin.zip\" \\\n  \"https://mirrors.cloud.tencent.com/gradle/gradle-${V}-bin.zip\"; do\n  echo \"Trying $url\"\n  rm -f gradle.zip\n  if curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 20 -o gradle.zip \"$url\" && unzip -tq gradle.zip >/dev/null 2>&1; then\n    ok=1\n    break\n  fi\n  echo \"Failed, trying next source\"\ndone\nif [ -z \"$ok\" ]; then\n  echo \"Could not download Gradle $V from any source.\"\n  exit 1\nfi\nunzip -q gradle.zip\necho \"$HOME/gradle-dist/gradle-${V}/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Gradle version",
          "run": "gradle --version"
        },
        {
          "name": "Build debug APK",
          "working-directory": "${{ steps.project.outputs.dir }}",
          "run": "set +e\nOPTS=\"--console=plain --no-daemon -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000 -Dorg.gradle.internal.http.connectionTimeout=90000 -Dorg.gradle.internal.http.socketTimeout=90000\"\nfor i in 1 2 3 4; do\n  echo \"=== Build attempt $i ===\"\n  gradle assembleDebug $OPTS 2>&1 | tee build.log\n  code=${PIPESTATUS[0]}\n  if [ \"$code\" -eq 0 ]; then\n    exit 0\n  fi\n  if grep -qE \"Could not (resolve|download|GET|HEAD)|Received status code 5|HTTP 5|Read timed out|Connection (reset|timed out)|Premature end|Unexpected end of\" build.log; then\n    echo \"Network problem while downloading dependencies. Waiting, then retrying.\"\n    sleep 30\n  else\n    echo \"Build error (not a network problem). See 'What went wrong' above.\"\n    exit \"$code\"\n  fi\ndone\nexit 1\n",
          "shell": "bash"
        },
        {
          "name": "Upload APK",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "seerat-debug-apk",
            "path": "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Lint (optional)",
          "continue-on-error": true,
          "working-directory": "${{ steps.project.outputs.dir }}",
          "run": "gradle lintDebug --stacktrace"
        },
        {
          "name": "Upload lint report",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "lint-report",
            "path": "${{ steps.project.outputs.dir }}/app/build/reports/lint-results-debug.html",
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  },
  "on": {
    "push": {
      "branches": [
        "main",
        "master"
      ]
    },
    "pull_request": null,
    "workflow_dispatch": null
  }
}
